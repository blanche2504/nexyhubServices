[project]
name = "nexyhub-services"
version = "0.1.0"
description = "NexyHub Air services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pymodbus>=3.8",
    "bleak>=0.22",
    "python-can>=4.5.0",
    "pyyaml>=6.0",
    "flask>=3.0",
]

[project.scripts]
nexyhub-can = "nexyhub_can.monitor:main"
nexyhub-serial = "nexyhub_serial.serial_echo:main"
nexyhub-rs485 = "nexyhub_serial.rs485_echo:main"
nexyhub-modbus = "nexyhub_serial.modbus_rtu:main"
nexyhub-ble = "nexyhub_ble.ble_scanner:main"
nexyhub-consumer = "nexyhub_ipc.consumer:main"
nexyhub-ui = "nexyhub_ui.app:app.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexyhub-can/nexyhub_can", "src/nexyhub-serial/nexyhub_serial", "src/nexyhub-ble/nexyhub_ble", "src/nexyhub-aggregator/nexyhub_ipc", "src/nexyhub-aggregator/nexyhub_ui", "src/shared/nexyhub_config", "src/shared/nexyhub_db", "src/shared/nexyhub_alarms", "src/shared/nexyhub_logs", "src/shared/nexyhub_utils"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
